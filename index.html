<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account & Key Binding</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #f3f4f6; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { width: 100%; max-width: 380px; background: #181b24; border: 1px solid #2a2f3d; border-radius: 12px; padding: 24px; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    label { display: block; font-size: 13px; color: #9ca3af; margin-top: 12px; }
    input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border-radius: 8px; border: 1px solid #323848; background: #11131a; color: #fff; }
    button { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 8px; background: #e11d48; color: #fff; font-weight: 600; cursor: pointer; }
    .msg { margin-top: 14px; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <form class="card" id="bindForm">
    <h2>Create Account & Bind Key</h2>
    <label>Username</label>
    <input id="username" required minlength="3" maxlength="32" />
    <label>Password</label>
    <input id="password" type="password" required minlength="6" />
    <label>License Key (BB-XXXX-XXXX-XXXX)</label>
    <input id="license_key" required placeholder="BB-XXXX-XXXX-XXXX" />
    <button type="submit">Register & Bind Key</button>
    <div class="msg" id="msg"></div>
  </form>

  <script>
    const form = document.getElementById("bindForm");
    const msg = document.getElementById("msg");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "Working...";
      const payload = {
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
        license_key: document.getElementById("license_key").value.trim().toUpperCase(),
      };
      const res = await fetch("/api/register-and-bind", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      msg.style.color = data.ok ? "#34d399" : "#f87171";
      msg.textContent = data.message || (data.ok ? "Account created and key bound." : "Failed.");
    });
  </script>
</body>
</html>
